services:
  meme-generator:
    image: ${DOCKERHUB_USERNAME}/meme-generator-api:latest
    container_name: meme-generator            # nginx proxies to this name
    restart: unless-stopped
    expose:
      - "5000"                                # internal only — ingress goes through the proxy
    networks:
      - web
    labels:
      # Picked up by the Ofelia scheduler container (job runs INSIDE this container)
      ofelia.enabled: "true"
      ofelia.job-exec.cleanup.schedule: "@hourly"
      ofelia.job-exec.cleanup.command: "curl -fsS http://localhost:5000/api/shooting-stars/remove_files"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  web:
    external: true
