# Managed alongside the weekly audit in milovdpas/vps_hosting (doc 07).
# Dependabot opens the fix PRs; the audit only reports what is still open.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/app"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      routine:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: "/app"
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Dependabot reads the tag number and nothing else, so it will offer a
      # major that is already EOL. Move base images by hand after checking the
      # release schedule.
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]

  # Keeps actions/checkout, setup-node etc. patched.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
