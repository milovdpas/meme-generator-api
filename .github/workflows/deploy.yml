name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/meme-generator-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/meme-generator-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Transfer deployment files to VPS
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /opt/apps/meme-generator"

          printf "DOCKERHUB_USERNAME=%s\n" "${{ secrets.DOCKERHUB_USERNAME }}" > deploy.env

          rsync -avz -e "ssh -o StrictHostKeyChecking=accept-new" \
            docker-compose.prod.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/apps/meme-generator/docker-compose.yml
          rsync -avz -e "ssh -o StrictHostKeyChecking=accept-new" \
            deploy.env \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/apps/meme-generator/.env

      - name: Deploy with Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            cd /opt/apps/meme-generator
            docker compose pull
            docker compose up -d
            docker compose ps
          ENDSSH

      # Ofelia reads ofelia.* labels when the scheduler starts and never again.
      # A job it has already registered survives its container being recreated,
      # which is why the hourly cleanup here has run since July untouched. What
      # it never notices is a job that did not exist at its last start, or a
      # changed schedule or command on an existing one.
      #
      # A neighbouring app lost a per-minute job to exactly this for a month:
      # correct labels, a scheduler that had been up since before the app
      # existed, and no sign of a problem anywhere except the work not happening.
      #
      # This deploy is the only moment these labels can change, so the restart
      # goes here. It costs seconds, re-scans every labelled container on the
      # host, and the check below means a scheduler that comes back without the
      # job fails the deploy rather than looking green.
      - name: Re-register scheduled jobs with the scheduler
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -e
            docker restart scheduler
            sleep 5

            if ! docker logs scheduler 2>&1 | tail -20 | grep -q 'cleanup'; then
              echo "The scheduler restarted without registering the cleanup job."
              docker logs scheduler --tail=20
              exit 1
            fi
            echo "cleanup registered."
          ENDSSH
